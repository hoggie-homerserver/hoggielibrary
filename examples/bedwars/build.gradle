plugins {
    id "fabric-loom" version "1.9.2"
}

version = "1.0.0"
group = "net.hoggielibrary.examples"

base { archivesName = "bedwars-example" }

repositories {
    flatDir { dirs "libs" }
    maven { url = "https://maven.fabricmc.net/" }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings "net.fabricmc:yarn:1.21.1+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.9"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.102.0+1.21.1"
    modImplementation files("libs/hoggielibrary-1.0.0.jar")
}

processResources {
    inputs.properties(["version": version])
    filesMatching("fabric.mod.json") { expand(["version": version]) }
}
